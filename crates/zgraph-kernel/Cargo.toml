[package]
name = "zgraph-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# 仅测试构建可用的故障注入入口（spec 03 §3.2 `test_hooks`）。
test-hooks = []

[dependencies]
zgraph-dsl = { path = "../zgraph-dsl" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true

# 故障注入用例（死锁/强制超时/ticker）只在 `test-hooks` feature 下编译。
# 用法：`cargo test -p zgraph-kernel --features test-hooks`
[[test]]
name = "test_hooks"
path = "tests/test_hooks.rs"
required-features = ["test-hooks"]
