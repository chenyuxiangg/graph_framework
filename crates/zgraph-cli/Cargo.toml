[package]
name = "zgraph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zgraph"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
zgraph-dsl = { path = "../zgraph-dsl" }
zgraph-kernel = { path = "../zgraph-kernel" }
zgraph-trace = { path = "../zgraph-trace" }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
zgraph-kernel = { path = "../zgraph-kernel", features = ["test-hooks"] }
