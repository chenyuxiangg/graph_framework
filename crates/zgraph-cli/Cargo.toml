[package]
name = "zgraph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zgraph"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
uuid.workspace = true
zgraph-dsl = { path = "../zgraph-dsl" }
zgraph-harness = { path = "../zgraph-harness" }
zgraph-kernel = { path = "../zgraph-kernel" }
zgraph-trace = { path = "../zgraph-trace" }
zgraph-worker = { path = "../zgraph-worker" }

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zgraph-kernel = { path = "../zgraph-kernel", features = ["test-hooks"] }

# pid 判活（`kill(pid, 0)`；06 §6.8.1/§6.8.3）。nix 与 zgraph-worker 使用同一版本/特性。
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }
