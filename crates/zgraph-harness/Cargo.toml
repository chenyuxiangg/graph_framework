[package]
name = "zgraph-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# v0.3（DR-010）：MCP client（stdio + Streamable HTTP 双 era）。默认关：不引入依赖、
# 不读 registry、不启进程；CLI 默认 feature 打开（`--no-default-features` 可关）。
mcp = ["dep:rmcp", "dep:process-wrap", "dep:http"]

[dependencies]
zgraph-kernel = { path = "../zgraph-kernel" }
zgraph-dsl = { path = "../zgraph-dsl" }
zgraph-worker = { path = "../zgraph-worker" }
serde.workspace = true
serde_json.workspace = true
# v0.3/V4（REV-099 C1）：外部 harness `llm_calls` 的 `inputs_hash`（与图 hash 同算法）。
blake3.workspace = true
# v0.4/D2（DR-013 §3/§8）：内置文件工具 sha256 / unified diff。
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
genai.workspace = true
# genai 0.7.2 的 `ChatStream` 只实现 `futures::Stream`；取流需要 `StreamExt`。
# 选更小的 `futures-util`（genai 已把它作为传递依赖编译）。
futures-util.workspace = true
# v0.3（DR-010）：MCP Rust client（精确锁版本；feature-gated，默认不编译）。
rmcp = { version = "=3.8.0", optional = true, default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# 进程组 kill（stdio 子进程清理；DR-010 §4）与 HTTP 自定义 headers。
process-wrap = { version = "10.0", optional = true }
http = { version = "1", optional = true }

# v0.3/V4（DR-011 §2.2）：外部 harness 进程组信号（仅 Unix；crate 级 forbid(unsafe_code)）。
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
