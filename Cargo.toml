[workspace]
resolver = "2"
members = [
    "crates/zgraph-dsl",
    "crates/zgraph-kernel",
    "crates/zgraph-trace",
    "crates/zgraph-worker",
    "crates/zgraph-harness",
    "crates/zgraph-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["chenyuxiangg <1007423165@qq.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tempfile = "3"
