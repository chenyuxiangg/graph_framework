[project]
name = "graph-base"
version = "0.1.0"
description = "任务流图模型框架（graph_base）：用有向图描述带状态的 SOP，并提供调度与状态管理"
requires-python = ">=3.10"
authors = [{ name = "chenyuxiangg", email = "1007423165@qq.com" }]
# 当前运行时无第三方依赖；monitor 依赖的 scripts/zlog 是缺失的仓库内资产（见 doc/issues.md ISSUE-001）
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src", "tests"]
addopts = "-q"
