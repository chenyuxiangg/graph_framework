[project]
name = "zgraph"
version = "0.1.0"
description = "图模型驱动工作流框架：Rust 内核 + Python 子进程 worker（M0 骨架）"
requires-python = ">=3.10"
authors = [{ name = "chenyuxiangg", email = "1007423165@qq.com" }]
# 运行时无第三方依赖（worker SDK 只用标准库）；legacy/ 为历史 Python 实现，不参与安装/测试
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python"]
addopts = "-q"
